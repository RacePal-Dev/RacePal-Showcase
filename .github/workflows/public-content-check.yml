name: Public showcase safety checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-review-baseline:
    name: Public file/secret baseline check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sanitized showcase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public contents and internal Markdown links
        run: python3 scripts/check_public_content.py
